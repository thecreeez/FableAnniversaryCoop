; Native depth multiplier. 1.0 disables added depth.
BoneDepthScale=1.50
; Depth=0 disables the complete garment handler. Region keys paint front lobes.
Depth=6.0
HalfWidth=7.5
Height=143.0
RadiusX=14.0
