; Adult Theresa painted garment weights + native bone scale. Read at launch.
; Set Depth=0 to disable. Original game meshes remain unchanged.
; Uses ordinary skeletal shaders; does not require morph-compatible materials.
[Chest]
; Native depth multiplier. 1.0 disables added depth; default 1.35.
BoneDepthScale=1.35
; Depth=0 disables the complete garment handler. Region keys paint front lobes.
Depth=6.0
HalfWidth=7.5
Height=143.0
RadiusX=14.0
RadiusZ=18.0
RigidFactor=0.75
MaxStretch=1.25
; RigidFactor/MaxStretch remain for historical geometry checks, not weight amplitude.

; Optional overrides use the exact garment object name, for example:
; [MESH_HERO_PLATEARMOUR_SHIRT_01]
; Depth=6.0
; RadiusX=12.0
